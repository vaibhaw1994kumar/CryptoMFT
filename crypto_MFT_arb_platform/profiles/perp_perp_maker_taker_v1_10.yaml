# Owner 13 Nov (E0 decisions, applied to v1_9 itself, not a new profile): oms.maker_ack_deadline ON; hedge_faults.silent_carry_bound below_one_lot (a failed hedge always unwinds, whatever its size). Both are safety rules, not strategy changes; results labelled v1_9 before this date carried neither.
# perp_perp_maker_taker_v1_9 = perp_perp_maker_taker_v1_7 + ONE change (owner 12 Nov, EMS note section 1, price-cap construction): execution.hedge.cap size_aware. The hedge cap starts from the level the hedge quantity reaches on the bot's VIEW of the hedge book, plus the slack floor (5 bps) and an optional volatility/latency term (k = 0, ASSUMED), never beyond the touch by more than max_slip_bps (15, ASSUMED), on the venue's grid without loosening; where the view book has no depth beyond the touch it falls back to touch_slack and says so. Quote withdrawal (v1_8) is NOT in v1_9: one change at a time. EXPLORATORY. v1_5 to v1_8 are unchanged.
# Owner 11 Nov (S1 label check): the 50 ms hedge-move horizon of the adverse table is below the data resolution for March 2024 (Bybit receive time constructed, Binance best bid/ask). Label only: no number, no switch and no table changed (decision_status.s1_label_resolution).
# perp_perp_maker_taker_v1_7 = perp_perp_maker_taker_v1_6 + ONE switch (owner 10 Nov, S3 / the HOLDOUT gate score): arb.block_on_toxic false. EXPLORATORY. Evidence: out/integration/s3/study/s3_gate_holdout_report.json (sha256 e1db1d0cf6c847ec8162ef891f7c4b27dbcedb38f45d7c8de18814c2897b256f):
# on HOLDOUT 2024-03-13 and 03-14 (full days; 03-15 had not finished, so TWO day blocks: the interval is degenerate) the events the gate flags earned +1.99 bps net each against +1.90 for the unflagged (strict queue rule; flagged minus unflagged +0.09, p5 -0.015 bps, the rule's bar is -1.0),
# i.e. the gate does not protect anything on the market-data events; on SELECT (217 events) it removed 18 events at +2.07 bps each. The S3 filter that was to replace it was REJECTED on reduced data (rerun after Phase E), so v1_7 is the gate OFF, nothing in its place.
# Caveat (C64): the event study overstates tradeable events (51% fail the entry rule on the strategy's delayed view) and the replay's toxic gate fires on far more evaluations than the study's flag; the effect of the gate on v1_6 REPLAYS is not measured here.
# perp_perp_maker_taker_v1_6 = perp_perp_maker_taker_v1_5 + ONE switch (owner 9 Nov, S1): adverse_table. The strategy's expected hedge move per side (the pinned -0.488 bps) is replaced by a table fitted from MARKET-DATA labels only
# (every public print on Bybit that would fill a passive quote; the Binance mid move at 50 ms and at 1 s afterwards), by depth reached, hedge-mid volatility and same-direction flow; TRAIN 03-01..03-07, scheme and shrinkage chosen on SELECT, HOLDOUT never read.
# block_on_toxic is NOT changed here (one change at a time); the table-with-toxic-gate-off variant is a separate labelled run.
# perp_perp_maker_taker_v1_5 = perp_perp_maker_taker_v1_4 + runtime: session (Phase D, owner 8 Nov). Everything else is v1_4's, byte for byte, so v1_5 against v1_4 isolates the runtime. The session path is wired in step D5.
resync_delay_s: 5.0                      # ASSUMED (Phase D, owner 8 Nov): seconds trading stays suspended after a book goes invalid with no snapshot in the data (a message that ends crossed, a gap) before the venue is resubscribed and resynced from the data's own state. Live reconnect backoff is 1 s; this adds a snapshot round trip and the start-up gate. Labelled ASSUMED in every manifest; sensitivity 1 s and 15 s are separate labelled runs.
# perp_perp_maker_taker_v1_4 = perp_perp_maker_taker_v1_3 + the B2 accounting switches, added ONE AT A TIME (owner 7 Nov). Step 7 (ledger): ledger_source: core. Step 6 (margin): margin_source: core. Step 5 (funding): funding_source: core. Step 4 (fees): fee_source: core, the rates come from the core FeeSchedule (crypto_stat_arb.fees.FEE_TIERS), the headline tiers are Bybit VIP 5 + Binance VIP 9 (PUBLIC_SCHEDULE_UNVERIFIED, 2.7 bps per maker-hedge pair). With fee_presets overridden to bybit_perp_mm + binance_perp_vip0 this profile equals v1_2 byte for byte (the identity cell).
# perp_perp_maker_taker_v1_3 = perp_perp_maker_taker_v1_2 (FROZEN) + ONE switch (owner 7 Nov, S0): execution.primary.reprice, quote repricing. Everything else is v1_2 unchanged; with the switch off the results equal v1_2's.
# perp_perp_maker_taker_v1_2 = perp_perp_maker_taker_v1_1 (kept byte-identical as the control) + ONE switch (owner decision, Phase B0, 5 Nov 2026):
#   arb.join_touch_on_tick_rounding: a quote that was inside the spread before tick rounding and lands ON the touch once rounded joins the back of that level's queue (full displayed size ahead)
#   if the edge recomputed at the rounded price still passes, instead of being refused. v1.1 refuses it (tick_rounding_no_improve). Results depend on the fees, which stay ASSUMED.
# Owner 6 Nov: (1) the hedge move pin is the 7-day 45 ms arrival estimate (hedge_move_calibration below); (2) timing.floors_ms: min 35 ms on the Binance entry and cancel timelines, ASSUMED; (3) message_atomic_book: true; (4) margin.above_last_tier: breach (A9); (5) hedge_faults.query_before_replace: true (OMS03); (7) owner 6 Nov, after the ledger result: trust_local_ts false on both venues (ASSUMED, own change); (8) owner 6 Nov: through-print rule, volume-limited version only (maker.fill_through_prints and maker.through_print_volume_limited, both true; the full version is refused at startup); (6) owner 6 Nov, Phase B depletion ledger: maker.depletion_ledger: true (a depth decrease records the head movement it applied; its print then moves the queue only by the rest, and trade_after_front uses only the print left after that movement).
# Everything below is v1.1 unchanged except `name`, `description`, that one key, the pinned hedge move and the run-defining keys added in B0.
# perp_perp_maker_taker_v1_1 = perp_perp_maker_taker_v1 (kept frozen as the reference) + the audit's integrity ladder (L3 audit decisions, 2026-11-04).
# Seven cumulative switches, in this order, each measured in v1_1_switch_ladder_report.html; everything else is byte-for-byte v1.
#   1 data manifest gate + truncation count (applied by the runner: --data-manifest; the path is not a profile key)   2 trade_dedupe: multiset
#   3 maker.ledger_epoch   4 own_impact: overlay   5 book_tape_repair: false   6 fitted unknown queue (floor 0, flagged fallback 25)
placement_book: view                    # v1_2 switch (owner 7 Nov): 'truth' = a passive order joins the venue-truth book at its arrival (the book PostOnly is judged on) when it is complete there, the view book otherwise (counted). Built and measured alone; OFF in the profile until the owner approves the measurement
trust_local_ts:                      # v1_2 (owner 6 Nov, own change after the depletion ledger): ASSUMED. The March-2024 local stamps are exchange time + exactly 2.000 ms on every record (constructed, not measured), so they are NOT used as receive time; the latency preset's feed delay is applied instead (one sample per exchange message). v1.1: both venues trusted
  bybit: false
  binance: false
message_atomic_book: true            # v1_2 (owner Phase B): the deltas of one exchange message (same venue, exchange_ts, receive time) are one unit: a cross inside it is not repaired, the strategy, touch and maker queue updates run after the whole message. v1.1: false
#   7 evidence-required fills (vanish_clears_queue: false, fill_evidence: trade_confirm)   8 maker.opposite_cross_confirm_ms: 500 (cross fills need a reaching print within +-500 ms; 2026-11-04 owner step).
# Step 9 (owner, 2026-11-04, after the review of the step-8 reports): five corrections, each an opt-in switch, all on here:
#   9a arb.expected_hedge_move_bps_{bid,ask} are estimated from MARKET DATA only (Binance mid move 0-1 s after each Bybit print on our side, TRAIN days; new_backtest/market_hedge_move.py), never from
#      simulated fills (the runner supplies the number; the profile alone carries 0)   9b arb.round_quotes_to_tick (bids down, asks up; the runner declares the venue ticks)
#   9c maker.opposite_cross_cap_to_print: a confirmed cross fills at most the reaching prints' volume, each print spent once   9d arb.maker_venues is NOT set here (a data-dependent choice: the March runner
#      sets ["bybit"] because Binance March-2024 has no depth)   9e hedge_arrival_book: truth (the hedge executes on the venue-truth book at its arrival, for every dataset).
hedge_move_calibration:                  # PINNED (owner 6 Nov, replaces the B0.2 pin): the PROBE estimate on the 7 TRAIN days 03-01..03-07, Binance mid move from the fill to a FIXED 45 ms after it = -0.488 bps (bid only: the probe quotes a bid; the ask value is the market-data one, unused while maker_passive_side is bid)
  file: config/hedge_move_arrival45ms_mar2024_train_0301_0307_v1.json
  sha256: c369b1b97af87dd7cecf146cce0583361be0d026a1d6dc6e3fed0d32506e8de7
  # an ARRIVAL ESTIMATE: the 45 ms is an ASSUMED hedge arrival delay (the singapore preset gives about 31-52 ms), NOT measured on mainnet. The probe slices cover 00:00-02:00 UTC of each day only. Estimated on the simulator's own probe fills (EXPLORATORY).
  # The earlier pins stay on disk: 1 s window, 03-01..03 (-0.771, config/hedge_move_probe_mar2024_train_0301_0303.json); 7-day 130 ms sensitivity value -0.862 (to be run at the Phase B freeze).
adverse_table:                           # S1 (owner 9 Nov): PINNED by sha256 like hedge_move_calibration; the days it was fitted on must all end before the run starts. Fitted on FULL March-2024 days (24 h, 4.7M print events; the first pass used the 00:00-02:00 slices only). Scheme depth + flow, depth buckets (1, 2, 4, 8) in ticks of 0.001 (the March 2024 SOLUSDT tick), shrinkage k = 1000, chosen on SELECT at 50 ms. EXPLORATORY: market-data labels, not a simulator-validated adverse-selection model
  file: config/adverse_table_mar2024_train_0301_0307_fullday_v1.json
  sha256: 9c06b5c983e7d56cbaeacbd6eb188a6f42fa79246fd78e99febafbe090198854
  horizon_s: 0.05                        # the hedge move in the quote price and the entry rule: the label horizon closest to the assumed 45 ms hedge arrival delay (no measured Binance delay exists), so v1_6 against v1_5 is conditioning at the same horizon
  requote_horizon_s: 1.0                 # the repricing rule (S0, off in this profile) and markouts read the 1 s table
# Queue parameters remain a SPOT PRIOR, perp-unvalidated (decision E), and say so in every result.
# perp_perp_maker_taker_v1 — passive leg on one USDT-perp venue, taker hedge on the other, dispatched on the maker fill.
# Every switch is classified (see src/new_backtest/profiles.py SWITCHES): MANDATORY controls cannot be disabled here; CALIBRATED
# numbers name their source; LEGACY_COMPAT switches exist only so legacy_v0 stays reachable. Values marked PROVISIONAL / PLACEHOLDER /
