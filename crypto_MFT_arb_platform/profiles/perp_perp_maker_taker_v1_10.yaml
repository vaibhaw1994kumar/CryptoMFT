name: perp_perp_maker_taker_v1_10
description: v1.10 = v1.9 + quote withdrawal ON (arb.quote_withdraw, hysteresis 1.5 bps ASSUMED) + S0 repricing ON (execution.primary.reprice, ILLUSTRATIVE_NOT_FITTED) + hedge dust carry (hedge_faults.dust_carry next_hedge) + a 1 s no-requote after a withdrawal (owner 16 Nov; EXPLORATORY; the live candidate). With real orders the amend is refused until case2i_passed and testnet_amend_drill_passed are both true in decision_status. v1.9 = v1.7 + hedge cap size_aware (owner 12 Nov; EXPLORATORY; quote withdrawal stays off). v1.7 = v1.6 + block_on_toxic false (owner 10 Nov; EXPLORATORY; evidence s3_gate_holdout_report.json). v1.6 = v1.5 + S1 (owner 9 Nov), the adverse-selection table (arb.adverse_table, the expected hedge move by depth, volatility and flow, fitted on March-2024 TRAIN market-data labels only) in place of the single hedge-move number; EXPLORATORY until simulator validation. v1.5 = v1.4 + the session runtime (core TradingSession behind the QueueAwareVenueAdapter, Phase D; parity is v1_5 against v1_4; not wired until step D5, so a run is refused at start). v1.4 = v1.3 + B2 steps 4 to 7, fees from the core FeeSchedule, funding from the core FundingEngine, margin from the core RiskEngine and the ledger, bridge and economics gate from the core (fee_source core, funding_source core, margin_source core, ledger_source core; headline Bybit VIP 5 + Binance VIP 9, PUBLIC_SCHEDULE_UNVERIFIED); with fee_presets bybit_perp_mm + binance_perp_vip0 it equals v1.2; EXPLORATORY
product: perp
decision_status:                         # carried into every result's release_identity
  block_on_toxic: OFF_BY_HOLDOUT_GATE_SCORE_EXPLORATORY_SHA256_e1db1d0cf6c847ec8162ef891f7c4b27dbcedb38f45d7c8de18814c2897b256f   # v1_7 (owner 10 Nov): the toxic gate is off; two HOLDOUT day blocks only
  march_stamps: ASSUMED_CONSTRUCTED_LOCAL_TS_NOT_TRUSTED_PRESET_FEED_DELAY_APPLIED   # owner 6 Nov: the 2 ms March stamps are constructed; the feed delay is the preset's (ASSUMED, not measured)
  net_ceiling_multiple: DECISION_PENDING_CALIBRATION
  fill_headroom_base: DECISION_PENDING_CALIBRATION   # value is the assistant's starting choice
  breaker: DECISION_PENDING_CALIBRATION
  unwind_band_bps: DECISION_PENDING_CALIBRATION
  unwind_max_attempts: DECISION_PENDING_CALIBRATION
  case2i_passed: false                   # owner 16 Nov: the real-order amend guard (config.amend_guard_from_profile): with real orders no amend is sent until BOTH flags are true; set by the owner after case 2i on this profile and the testnet amend drill
  testnet_amend_drill_passed: false
  residual_limit: DECISION_PENDING_CALIBRATION   # owner 8 Nov 2026: the core's two stages, hold new risk at 5 s and kill switch at 30 s (the backtester's own 5 s net-exposure breaker stays until Phase D)
  unwind_band_core: DECISION_PENDING_CALIBRATION   # owner 8 Nov 2026: 15 bps in the core too (it was 10)
  hedge_unknown_escalation: DECISION_PENDING_CALIBRATION   # H16, accepted 8 Nov 2026: FAILED with alarm and kill switch, in the core
  p_fail: SCENARIO_NOT_CALIBRATED          # Phase C (owner 7 Nov): no execution logs exist; failure costs are reported per scenario, never as a measured rate
  loss_fail_bps: SCENARIO_NOT_CALIBRATED   # 7.8 came from a simulated hedge-failure study, not execution logs
  fees: PUBLIC_SCHEDULE_UNVERIFIED_BYBIT_VIP5_BINANCE_VIP9   # B2 step 4: owner-confirmed tiers, public rates as given 7 Nov 2026; the account's own SOLUSDT rates are not read; the Bybit -0.5 rebate is a scenario, not the headline
  requote: TRADER_SET_NOT_FITTED_OFF_BY_DEFAULT   # S0: the rule is built and modular; the numbers are the trader's (or the live bot's, labelled LIVE_VALUES); none is fitted
  queue_parameters: SPOT_PRIOR_PERP_UNVALIDATED   # decision E: calibrated on Bybit SPOT orders, never validated on the perp target
  hedge_move: PROBE_ARRIVAL_ESTIMATE_45MS_PINNED_BY_SHA256_EXPLORATORY
  adverse_table: MARKET_DATA_LABELS_TRAIN_ONLY_PINNED_BY_SHA256_EXPLORATORY   # S1: replaces the single hedge-move number in the quote price, the entry rule and the repricing rule
  s1_label_resolution: BELOW_DATA_RESOLUTION_50MS_MARCH_2024_BYBIT_RECEIVE_TIME_CONSTRUCTED_BINANCE_BEST_BID_ASK   # owner 11 Nov: 50 ms is below the data resolution for March 2024 (Bybit receive time constructed, Binance best bid/ask); the 1 s table is not affected
  data_manifest: REQUIRED_AT_RUN                  # ladder step 1: the runner supplies the manifest path; a truncated day needs a written reason
  unknown_queue_fit: PER_DAY_FILE_FROM_STRICTLY_EARLIER_DAYS   # ladder step 6: the runner supplies the day's fit; the profile alone cannot run a fitted queue
product_fee_consistency: true            # MANDATORY: fee presets must be perp presets
seed: 7                                  # owner 16 Nov: the run seed as a profile key (the current default; outputs unchanged)
latency_preset: singapore                # ASSUMED (host co-located with Bybit, ~35 ms to Binance) until ollog measurements replace it.
                                         # Owner decision 2026-11-02: was colocated_both, which config.py calls physically impossible
                                         # (sensitivity upper bound only); every v1 result before 2026-11-02 used colocated_both.
runtime: session                        # Phase D (owner 8 Nov): the core TradingSession behind the QueueAwareVenueAdapter replays the feed (v1_4 and every reference profile run on the backtester's own loop). Reference profiles refuse this value.
ledger_source: core                      # B2 step 7 (owner 7 Nov): headline equity and cash P&L come from the core ledger at the common-timestamp marks; the strict bridge, the reconciliation and the economics gate are the core's (run directory: economic_reconciliation.json, funding_report.json). v1_2 / v1_3: the backtester's own books
margin_source: core                      # B2 step 6 (owner 7 Nov): margin checks and the admission gate come from the core RiskEngine (tiers ASSUMED, cross, capital per venue as before). above_last_tier below becomes redundant (the core fails closed). v1_2 / v1_3: margin_model
funding_source: core                     # B2 step 5 (owner 7 Nov): funding is booked by the core FundingEngine: the funding record's own mark price where present, otherwise the book mid, flagged FUNDING_MARK_FALLBACK and counted in every result. v1_2 / v1_3: funding_settler
fee_source: core                         # B2 step 4 (owner 7 Nov): the names below are tier names of the core FeeSchedule (crypto_stat_arb.fees.FEE_TIERS), not backtester presets. v1_2 / v1_3: presets
fee_presets:                             # headline after B2: Bybit VIP 5 + Binance VIP 9 = 2.7 bps per maker-hedge pair, PUBLIC_SCHEDULE_UNVERIFIED until the account's own SOLUSDT rates are read.
  bybit: bybit_perp_vip5                 # scenarios (override at run time, labelled): bybit_perp_mm + binance_perp_vip9 = 1.2 bps (MM rebate, UNCONFIRMED); bybit_perp_mm + binance_perp_vip0 = 4.5 bps (the old ASSUMED set)
  binance: binance_perp_vip9
hedge_arrival_book: truth                # v1.1 step 9e: a hedge / retry IOC executes against the venue-truth book at its arrival time (v1 keeps the strategy's view book); one setting for every dataset
valuation: common_timestamp              # MANDATORY (R11)
own_impact: overlay                     # v1.1 step 4: own taker consumption lives in a shadow overlay; the public book is never mutated by an own fill (consume_liquidity stays on)
book_tape_repair: false                  # v1.1 step 5: the public book is not lowered from the trade tape (no double depletion when the depth decrease comes first)
equity_bridge: raise                     # MANDATORY
enforce_book_state: true                 # MANDATORY (WP4)
trade_dedupe: multiset                   # MANDATORY (native ids when present). v1.1 step 2: id-less data drops only repeats ACROSS files, never genuine identical prints
delta_uses_book_size: true               # MANDATORY (depth-size fix)
cancel_time_basis: exchange              # MANDATORY (D-03)
postonly_reject_model: "on"              # MANDATORY (lifecycle task 5): modelled PostOnly rejects at exchange time, arrival = decision + sampled ENTRY latency
calibration:                             # perp lifecycle calibration (ollog TESTNET runs from the Mac); refused if its product is not perp
  file: config/lifecycle_calibration_perp_bybit.json
  venue: bybit                           # the maker venue; its entry-latency grid ('all' = REST round trip / 2, local clock only) feeds ack_latency
  period: all
  source: MEASURED_TESTNET_FROM_MAC      # NOT mainnet and NOT VM -> exchange; see the report for what this does and does not establish
arb:
  profile: perp_perp_maker_taker_v1
  mode: maker_taker
  dispatch_mode: fill_triggered          # MANDATORY
  maker_passive_side: bid
  min_net_edge_bps: 1.0
  maker_max_age_s: 15.0                  # MANDATORY: order lifetime
  count_pending_exposure: true           # MANDATORY
  count_unknown_exposure: true           # MANDATORY
  net_ceiling_multiple: 1.0              # MANDATORY — hard net ceiling 1x max_position_base (DECISION_PENDING_CALIBRATION)
  max_venue_imbalance_base: 2.0          # owner 13 Nov (production limits approved): gross per venue 2.0 SOL at stage 0 (the replays used 5.0; the run scripts still set their own unless told: run_day.py takes the profile's value now). ASSUMED: no data basis, a smaller number makes a bug cheaper
  fill_headroom_base: 0.25               # SEPARATE fill headroom on top of the ceiling, base units at max_position_base=1 (STARTING VALUE chosen
                                         # by the assistant: 25% of one position, not specified by the owner; the size sweeps scale it with size)
  p_fail: 0.07                           # PLACEHOLDER — NOT MEASURED (assumed; a replay with no injected failures cannot measure it); sensitivity in the report
  loss_fail_bps: 7.8                     # SCENARIO, NOT CALIBRATED (came from a simulated hedge-failure study, not execution logs); report failure costs per scenario
  funding_expected_holding_s: 28800      # owner 14 Nov: the expected funding cost of the pair is charged for 8 h of holding (ASSUMED; to be replaced by the measured median holding time from the stage-0 logs, owner-approved); net funding of the pair from each venue's current predicted rate (the long venue's paid minus the short venue's received), per direction; with no rate (a replay without derivative data) the term is 0 and counted (funding_term_unavailable)
  funding_credit: floor_zero             # owner 14 Nov: funding may only LOWER the edge; a net credit counts as 0
  participation_max: 0.10                # E3 (owner 13 Nov): a NEW quote's size is capped at this share of the public volume printed at its price level on the maker venue over the last participation_window_s; a cap below the minimum clip refuses the quote (reject participation). ASSUMED 10% of the last 60 s, owner to approve. Hedges are never touched. Earlier profiles: off
  participation_window_s: 60
  quote_withdraw: true                   # v1_9s (owner 14 Nov): quote validity runs first on every book update (a quote that lost its edge is withdrawn), then the S0 controller
  quote_withdraw_hysteresis_bps: 1.5     # ASSUMED, WIDER than v1_8's 0.5 on purpose: the S0 stickiness band (1.0 bp) must be inside the withdrawal tolerance, or validity would always cancel a quote before the repricing rule could move it. Repricing acts at a 1.0 bp adverse move; validity withdraws only when the edge is still gone at 1.5 bps (an amend that has not taken effect yet, or no target)
  requote_delay_after_withdraw_s: 1.0   # owner 16 Nov (approved; ASSUMED 1 s): a quote withdrawn by validity is not placed again on the same venue and side for this long; counted
  funding_window_s: 30                   # owner 14 Nov: no new quote within 30 s before a funding timestamp on either venue (next funding time from the derivative stream); resting quotes are withdrawn when the window starts; quoting resumes when the stream shows the next settlement. No next-funding time = "not evaluable", counted (funding_window_not_evaluable), nothing blocked
  entry_hedge_price: vwap                # owner 13 Nov (edge calibration item 1): the hedge is priced at the VWAP the hedge-venue book gives for the quote's size, in the quote price and the entry edge (the same walk quote_validity uses); every earlier profile: touch (the ArbConfig default). expected_hedge_slippage_bps stays 0 by design.
  round_quotes_to_tick: true             # v1.1 step 9b: the quote is rounded onto the venue's price grid before the improve-the-touch check and the edge (the runner supplies arb.venue_ticks)
  join_touch_on_tick_rounding: true      # v1.2 (B0): a quote rounded onto the touch joins the back of its queue if the edge at the rounded price still passes; v1.1 refuses it
  # Run-defining settings that the runners used to set from the environment (B0, owner 5 Nov): they now live in the profile, so the profile hash identifies a run.
  # MARCH-2024 SOLUSDT set-up: Bybit-only makers (Binance March-2024 has no depth), 0.001 tick on both venues (measured: gcd of traded prices and first-snapshot levels).
  # Another dataset needs its own values (January 2022: Bybit tick 0.005, makers on both venues).
  maker_venues: [bybit]
  venue_ticks: {bybit: 0.001, binance: 0.001}
  block_on_toxic: false                  # v1_7 (S3, owner 10 Nov): OFF, the ONE change against v1_6 (v1_6 and every earlier profile: true, the ArbConfig default)
  max_cross_venue_skew_s: 0.2            # same as the ArbConfig default
  fill_gate_horizon_s: 5                 # the runners set 5 (the ArbConfig default is 15); it matters only when min_fill_prob > 0, which is 0 here
  expected_hedge_move_bps_bid: 0.0       # CALIBRATED: set per run by the runner from MARKET DATA on the TRAIN days (v1.1 step 9a; v1 used legacy_v0 fills), 0 = no information
  expected_hedge_move_bps_ask: 0.0
maker:
  min_queue_ahead: 25.0                  # LEGACY floor, superseded by unknown_queue_model below
  unknown_queue_model: depth_aware       # CALIBRATED (WP4)
  unknown_queue_dist: fitted             # v1.1 step 6: fitted on strictly earlier days (the runner supplies unknown_queue_fit per day)
  unknown_queue_fit: ""                   # PER DAY: set by the runner; empty here on purpose
  unknown_queue_floor: 0.0               # no universal floor on a fitted draw
  unknown_queue_fallback: 25.0           # used, and COUNTED (unknown_queue_fit_missing_venue_used_floor), only where the fit has no data for the venue
  cancel_model: proportional             # CALIBRATED (fill-evidence study 2026-10-30)
  vanish_clears_queue: false             # v1.1 step 7: a vanished level alone never fills an order
  fill_evidence: trade_confirm           # v1.1 step 7: every fill that rests on a depth decrease or a snapshot shrink needs a confirming print within evidence_window_ms
  ledger_epoch: true                     # v1.1 step 3: a snapshot / reset invalidates old netting credit; ambiguous associations are flagged
  fill_through_prints: false             # OFF in v1_2 and off the freeze list (owner 7 Nov, after the Step 8 re-check): the logic is correct and the engine is fixed (one print budget across the cross, through and ordinary rules; a netted print still reaches the through rule), but the rule is not part of v1_2. History: on from 6 Nov 18:31, off 7 Nov. A print strictly through our price means the level we rest on was consumed ...
  through_print_volume_limited: false    # ... but the fill is limited by the print's volume (ONE budget per print). The full version (fill_through_prints without this) is refused at startup. Turn BOTH on together only on the owner's instruction
  depletion_ledger: true                 # v1_2 (owner Phase B, step 4): both arrival orders of one execution (depth decrease / print) give the same queue ahead and the same fills when the print is at least as large as the decrease; netted pairs with no other proof are counted. v1.1: false
  evidence_window_ms: 20.0
  participation_cap: true                # E3 (owner 13 Nov): one budget per public print across every own order and every rule: own fills never exceed the volume of the print that caused them. Earlier profiles: off (default)
  share_trade_volume: true               # MANDATORY
  dedupe_trade_depth: true               # MANDATORY
  exchange_time_eligibility: true        # MANDATORY (causal fills)
  level_creator_trade_only: false        # LEGACY_COMPAT (opt-in)
  opposite_cross_fills: true             # CALIBRATED — PROVISIONAL: price priority, a resting order fills in full once the opposite best quote
                                         # reaches its price (hftbacktest probe cross-check 2026-11-03; owner decision 2026-11-04)
  opposite_cross_confirm_ms: 500.0       # v1.1 step 8: a cross is a fill only if a reaching print on the SAME venue executed within +-500 ms (before: fills at the cross; after: at the print); else dropped, no side effect
  opposite_cross_cap_to_print: true      # v1.1 step 9c: a confirmed cross fills min(remaining, the reaching prints' unused volume); one print never fills more than its size in total
  # Cohort queue (queue_model: cohort) is a v1_2 SENSITIVITY case only; the headline runs stay on the scalar queue. The sensitivity range uses cohort_age: uniform, run WITH this profile's cross rule
  # (opposite_cross_fills, its confirm window, cap-to-print), like v1.1. cohort_hazard_theta 0.5 is SPOT_CALIBRATED (spot data 04-19..04-22), NOT a perp fit: the hazard age rule stays out of the
  # range until a perp fit from probe data exists; any result that runs it carries cohort_hazard_theta.provenance.
dataset_settings:                        # v1_2 (owner 7 Nov): per-dataset settings, merged over this profile only when the runner names the dataset; January and every unnamed run keep the maker defaults (0.05 s / 20 ms)
  mar2024:
    maker:
      dedupe_window_s: 0.15              # March-2024 Bybit depth arrives in ~100 ms batches (lag median ~60 ms, report C6): the 50 ms trade/depth window missed pairs. PROPOSED by the TRAIN-day matching study, owner-approved 7 Nov
      evidence_window_ms: 50.0           # same study; January keeps 50 ms / 20 ms
timing:                                  # WP3; numbers ASSUMED from the latency preset until calibrated
  from_latency_preset: singapore         # same preset as latency_preset (owner decision 2026-11-02)
  equal_time_policy: market_first
  floors_ms:                             # ASSUMED (owner 6 Nov): a floor of 35 ms on the Binance entry and cancel timelines, the cross-region venue of the singapore preset (host near Bybit, Binance in Tokyo); draws below it are raised to it. Not measured. No decision time is added. A preset other than singapore gets no floor.
    singapore:
      binance: {entry: 35.0, cancel: 35.0}
  dead_feed_s: 5.0                       # MANDATORY
  truth_books: true                      # MANDATORY
  clock:
    host_offset_ns: 0                    # ASSUMED (no clock record for the Jan-2022 collector)
    uncertainty_ns: 0
    source: ASSUMED
breaker:                                 # MANDATORY — DECISION_PENDING_CALIBRATION: starting values given by the owner 2026-11-01
  consecutive_failures: 3                # 3 consecutive hedge FAILURES (one per hedge chain: a rejected hedge and its retries count once)
  failure_rate_window_n: 20              # failures in the last 20 hedge chains ...
  failure_rate_thresh: 0.05              # ... above 5% (i.e. 2 or more of 20; needs a full window of 20)
  trip_on_failed_unwind: true            # any unwind whose attempts are exhausted
  net_exposure_s: 5.0                    # |net| != 0 continuously for more than 5 s
  unknown_order_s: 2.0                   # an order UNKNOWN (ack timeout expired, unresolved) for more than 2 s
  trip_on_gateway_down: true             # a venue's gateway silent for heartbeat_timeout_s
  heartbeat_timeout_s: 10.0              # ASSUMED (not specified by the owner): the engine default
  tripped_unwind_retries: 10             # unwind sends still allowed while tripped (engine default)
# Reset is MANUAL ONLY: nothing in the simulator or the strategy clears a tripped breaker (bt.reset_breaker() is an operator action).
oms:
  rate_limits:                           # owner 13 Nov (production limits approved; ASSUMED: no venue data for the shares). New quotes use at most 70% of each rate-limit window and always leave at least 2 requests free;
    enabled: true                        # hedges, unwinds and flattens are NEVER refused by the limiter (they queue with priority and may use the whole window); cancels are unrestricted (the whole window).
    quote_share: 0.7                     # v1_5 to v1_8 and the core default: 0.8
    quote_min_free: 2
  session_limits:                        # owner 16 Nov (Order 3, limits A1-A6 and A8; A7 is arb.requote_delay_after_withdraw_s above). Off in every earlier profile. Values are the owner's approved numbers; none is calibrated.
    order_rate: {per_s: 2.0, burst: 5}   # A1: new maker orders and amends per venue, a token bucket; skipped, never queued; hedges, unwinds and cancels are never refused. On top of rate_limits above
    daily_loss_stop_usdt_per_sol_of_clip: -5.0   # A2: realised + marked P&L since 00:00 UTC (or the session start) at or below this per SOL of clip -> latched kill switch (quotes cancelled, hedges in flight finish). Scales with the clip (-5 at a 1 SOL clip)
    clock_offset: {max_uncertainty_ms: 5.0, max_age_s: 900}   # A3: no new quotes while the clock offset is unknown or its uncertainty is above 5 ms (server-time probe); max_age_s 900 is ASSUMED (probe every 300 s). A replay with no measured clock reports "not evaluable", counted, never blocked
    margin_warning: {free_margin_multiple: 10.0, resume_hysteresis_s: 5.0}   # A4: a margin WARNING (not a missing price) or free margin below 10x the initial margin at the hard cap stops new quotes; resumes after 5 s clear (ASSUMED)
    missing_marks_kill_s: 60.0           # A5: a margin price pause longer than 60 s trips a latched kill switch
    feed_arrival_stamp: true             # owner 17 Nov (A9 fix b): book frames are stamped at ARRIVAL in the live feed, so a backlog shows as book age and the gate, and a backlog beyond the book age limit resynchronises the connection. Live feed only: a replay has no live feed, so no replay output changes
    tier_table: read_at_start            # A6: real-order modes read each account's own risk-limit / leverage brackets at start-up and refuse to start if they cannot be read; replays keep the ASSUMED tiers below, labelled
    verify_account: {enabled: true, margin_mode: cross, leverage: 10}   # A8: paper/live start-up refuses unless one-way mode, this margin mode and leverage (10 = the instrument rule used here, ASSUMED), and reduce-only accepted
  maker_ack_deadline: true               # owner 13 Nov: a sent PostOnly quote is watched from the send, not only from its ack (a submit or ack lost in a gateway outage ends TIMED_OUT with the kill switch instead of sitting SENT unwatched; 565 s in the 2l replay). Earlier profiles: off. REQUIRED for any profile used with real orders (config.REAL_ORDER_REQUIRED)
  account_fee_check: true                # owner 13 Nov (edge calibration item 2): a declaration for live/paper: the session reads the account's SOLUSDT maker/taker rates on both venues at start-up and refuses to start if they differ from fee_presets (crypto_stat_arb.fees.verify_account_fee_rates). No effect on a backtest. REQUIRED for any profile used with real orders
hedge_faults:                            # the response policy (recovery), not injected faults
  seed: 11                               # owner 16 Nov: the hedge-fault seed as a profile key (the current default; outputs unchanged)
  response: retry_unwind                 # MANDATORY (not the legacy oracle)
  query_before_replace: true             # OMS03 (v1_2, Phase B): a hedge that gets no answer in an outage is queried before any retry or unwind is sent (the query waits for the gateway and for a ghost to land). v1.1: false
  max_retries: 2
  retry_backoff_s: 0.25
  entry_guard: true
  unwind_band_bps: 15.0                  # price-banded unwind, 15 bps (DECISION_PENDING_CALIBRATION)
  silent_carry_bound: below_one_lot      # owner 13 Nov: a failed hedge ALWAYS acts. When a hedge chain exhausts its retries the residual is unwound with MARKET_BANDED at the touch band (unwind_band_bps) whatever its size, and a failed unwind is the persistent alarm. Only a remainder below one hedge-venue lot (it cannot be sent) is carried silently, with the end-of-day warning. v1_7 and earlier: position_size (a residual under the position size, 1.0 SOL in the replay, was carried without any action)
  dust_carry: next_hedge                 # owner 16 Nov: a hedge chunk below the hedge venue's minimum is carried (one signed balance per venue and instrument) and added to the next hedge; sent alone as soon as it reaches the minimum; REQUIRED with real orders
  dust_alarm_after_s: 60.0               # ASSUMED (owner 16 Nov): carried dust older than this raises HEDGE_DUST_ALARM once (it blocks nothing)
  unwind_max_attempts: 3                 # 3 unwind sends per failed hedge chain, then the persistent ALARM (DECISION_PENDING_CALIBRATION)
  unknown_query_max_attempts: 3
margin:                                  # MANDATORY in a perp profile; tiers ASSUMED, prefunded capital per venue
  check_every_s: 1.0
  mark_stamp: own_timestamp              # owner 16 Nov: the 5 s mark rule fixed from v1_10: a mark older than 5 s by its OWN timestamp pauses, nothing is re-stamped (v1_9 and earlier re-stamp: marks live 9-10 s, LEGACY)
  flatten_other_venue: true
  above_last_tier: breach                # A9 (owner Phase B, the core rule wins): a position above the venue's last tier is a margin breach (POSITION_ABOVE_RISK_LIMIT, fail closed). v1.1: ignore
  venues:
    bybit:
      initial_capital: 1000.0
      mode: cross
      liquidation_fee_bps: 10.0
      source: ASSUMED
      tiers:
        - {max_notional: 50000.0, initial_rate: 0.02, maintenance_rate: 0.01}
        - {max_notional: 500000.0, initial_rate: 0.05, maintenance_rate: 0.025}
    binance:
      initial_capital: 1000.0
      mode: cross
      liquidation_fee_bps: 10.0
      source: ASSUMED
      tiers:
        - {max_notional: 50000.0, initial_rate: 0.02, maintenance_rate: 0.01}
        - {max_notional: 500000.0, initial_rate: 0.05, maintenance_rate: 0.025}

execution:                               # canonical execution layer, phase 0: values that reproduce today's behaviour exactly
  pairing: maker_taker                   # maker_taker | maker_maker (phase 3, experimental) | taker_taker; must equal arb.mode
  price_cap_required: true               # CALIBRATED until the cap decision (brief step 11): every non-unwind intent carries a worst price and each child stays inside it
  one_hedge_child: enforce               # MANDATORY (never 'off'): the canonical contract; a ghost child blocks a second one until it is resolved (4h.4)
  risk_reservation: enforce              # MANDATORY (never 'off'): atomic check-and-reserve of primary exposure (4h.2)
  primary:
    tactic: PASSIVE
    placement: deep                      # touch | improve | deep. deep = the price the CONDITIONAL edge requires (inside the spread): today's behaviour
    price_rule: conditional_edge
    reprice:                             # S0 (owner 7 Nov): the ONE change of v1_3. The rule is core (ems/tactics/passive.py decide_reprice); the trader supplies every number, none is defaulted or fitted here.
      enabled: true                      # v1_9s (owner 14 Nov): S0 ON in the session runtime. The numbers below are ASSUMED and labelled ILLUSTRATIVE_NOT_FITTED until the trader's or stage-0-measured values are owner-approved
      source: ILLUSTRATIVE_NOT_FITTED    # carried into every result
      band_down_bps: 1.0                 # ASSUMED stickiness band: reprice only when the target is more than 1 bp below a resting bid (above a resting ask)
      band_up_bps: null                  # null: favourable moves never move a quote
      debounce_ms: null                  # after a hedge-price jump, favourable reprices wait this long
      jump_bps: null                     # what counts as a jump
      min_interval_ms: 1000.0            # ASSUMED: at least 1 s between two reprice requests of one quote (at most ~1 amend/s per quote, inside the quote tier of the rate limiter)
      max_age_s: 15.0                    # as the 15 s lifetime backstop (arb.maker_max_age_s): a quote this old is cancelled and re-quoted
      queue_hold: true                   # an order with a real queue ahead keeps its place against favourable moves
      amend_first: true                  # false: every price change is a cancel and a new order
  hedge:
    tactic: IOC_CAPPED
    cap: size_aware                      # v1_9 (owner 12 Nov): the ONE change against v1_7 (touch_slack); the level the hedge size reaches on the view book + the slack floor, bounded by max_slip_bps
    slack_bps_floor: 5.0
    max_slip_bps: 15.0                   # ASSUMED (owner 12 Nov): never beyond the touch by more than this
    vol_k: 0.0                           # ASSUMED: the k of k * short_vol * sqrt(hedge_latency); 0 = off
    latency_s: 0.0                       # the hedge latency the volatility term scales with
  unwind:
    tactic: MARKET_BANDED                # the unwind price band is hedge_faults.unwind_band_bps

